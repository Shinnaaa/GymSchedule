<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Daily training timeline and carb-cycling nutrition targets, calculated from your body, goal and weekly plan.">
<meta name="theme-color" content="#080a0c">
<title>Fitness OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@400;500;600&display=swap">
</head>
<body>

<div class="topbar">
  <div class="logo" data-i18n="app.name"></div>
  <div class="topbar-right">
    <div class="lang-switch" data-role="lang-switch"></div>
    <div class="clock-main" id="clock">--:--</div>
    <div class="clock-date" id="clockDate">--</div>
  </div>
</div>

<div class="week-banner">
  <div class="week-info">
    <span class="week-num" id="weekNum"></span>
    <span class="week-note" id="weekNote"></span>
  </div>
  <button class="weight-btn" id="open-weight-modal" data-i18n="weight.log"></button>
</div>

<div class="onboard-banner hidden" id="onboardBanner">
  <span data-i18n="onboard.text"></span>
  <button class="onboard-btn" data-go-tab="settings" data-i18n="onboard.go"></button>
</div>

<div class="day-picker" id="dayPicker"></div>

<div class="hero">
  <div class="day-type-row">
    <div class="day-chip" id="dayChip"></div>
    <div class="day-chip chip-ovr hidden" id="overrideChip" data-i18n="hero.changed"></div>
  </div>
  <div class="day-title" id="dayTitle"></div>
  <div class="diet-badge" id="dietBadge"></div>
</div>

<div class="now-card" id="nowCard">
  <div class="now-eyebrow" data-i18n="now.eyebrow"></div>
  <div class="now-task" id="nowTask"></div>
  <div class="now-detail" id="nowDetail"></div>
  <div class="now-next hidden" id="nowNext">
    <span data-i18n="now.next"></span><span class="now-next-time" id="nowNextTime"></span><span id="nowNextTask"></span>
  </div>
</div>

<div class="override-section" id="overrideSection">
  <div class="sec-label" data-i18n="override.title"></div>
  <div class="override-btns" id="overrideButtons"></div>
  <div class="override-hint" id="overrideHint" data-i18n="override.hint"></div>
</div>

<div class="tab-bar" role="tablist">
  <button class="tab-btn active" data-tab="timeline" data-i18n="tab.timeline"></button>
  <button class="tab-btn" data-tab="nutrition" data-i18n="tab.nutrition"></button>
  <button class="tab-btn" data-tab="photo" data-i18n="tab.photo"></button>
  <button class="tab-btn" data-tab="shopping" data-i18n="tab.shopping"></button>
  <button class="tab-btn" data-tab="weight" data-i18n="tab.weight"></button>
  <button class="tab-btn" data-tab="settings" data-i18n="tab.settings"></button>
</div>

<!-- Timeline -->
<div class="tab-panel active" id="tab-timeline">
  <div class="section"><div class="timeline" id="timeline"></div></div>
  <div class="section section-gap">
    <div class="sec-label" data-i18n="mobility.title"></div>
    <div class="spine-grid" id="mobilityGrid"></div>
  </div>
</div>

<!-- Nutrition -->
<div class="tab-panel" id="tab-nutrition">
  <div class="section">
    <div class="sec-label" data-i18n="nutri.tier"></div>
    <div class="tier-row" id="tierRow">
      <button class="tier-btn tier-strict" data-tier="strict" data-i18n="tier.strict"></button>
      <button class="tier-btn tier-normal" data-tier="normal" data-i18n="tier.normal"></button>
      <button class="tier-btn tier-loose" data-tier="loose" data-i18n="tier.loose"></button>
    </div>
    <div class="tier-desc" id="tierDesc"></div>
    <div class="sec-label"><span data-i18n="nutri.today"></span> · <span id="dietTypeLabel" class="sec-label-plain"></span></div>
    <div class="macro-grid" id="macroGrid"></div>
    <div class="macro-note" id="weekNoteNutrition"></div>
    <div class="warn-note hidden" id="belowBmr" data-i18n="nutri.belowBmr"></div>
  </div>
  <div class="section section-gap">
    <div class="sec-label" data-i18n="nutri.byDay"></div>
    <div class="byday-grid" id="byDay"></div>
  </div>
  <div class="section section-gap">
    <div class="sec-label" data-i18n="nutri.supplements"></div>
    <div class="suppl-list" id="supplList"></div>
    <p class="disclaimer" data-i18n="nutri.disclaimer"></p>
  </div>
</div>

<!-- Photo -->
<div class="tab-panel" id="tab-photo">
  <div class="section">
    <div class="sec-label" data-i18n="photo.title"></div>
    <label class="photo-drop" id="photoDrop" for="photoFileInput">
      <div class="photo-drop-icon">📷</div>
      <div class="photo-drop-text" data-i18n="photo.drop"></div>
      <div class="photo-drop-sub" data-i18n="photo.dropSub"></div>
    </label>
    <input type="file" id="photoFileInput" accept="image/*" hidden>
    <img id="photoPreview" class="photo-preview hidden" alt="">
    <button class="scan-btn" id="scanBtn" disabled data-i18n="photo.scan"></button>
    <div id="scanOutput"></div>
  </div>
  <div class="section section-gap">
    <div class="sec-label" data-i18n="photo.log"></div>
    <div id="scanLog"></div>
    <div class="manual-row">
      <input class="setting-input manual-name" id="manualName" data-i18n-placeholder="photo.manualName">
      <input class="setting-input manual-kcal" id="manualKcal" type="number" min="0" max="5000" data-i18n-placeholder="photo.manualKcal">
      <button class="setting-save" id="manualAdd" data-i18n="photo.manualAdd"></button>
    </div>
  </div>
</div>

<!-- Shopping -->
<div class="tab-panel" id="tab-shopping">
  <div class="section">
    <div class="sec-label" data-i18n="shop.title"></div>
    <div id="shopContent"></div>
  </div>
</div>

<!-- Weight -->
<div class="tab-panel" id="tab-weight">
  <div class="section"><div class="wt-stats-row" id="wtStatsRow"></div></div>
  <div class="section section-gap">
    <div class="sec-label" data-i18n="wt.metrics"></div>
    <div class="gauge-row" id="gaugeRow"></div>
  </div>
  <div class="section section-gap">
    <div class="sec-label" data-i18n="wt.trend"></div>
    <canvas id="weightChart" height="160"></canvas>
    <div id="chartEmpty" class="weight-empty hidden" data-i18n="wt.chartEmpty"></div>
  </div>
  <div class="section section-gap">
    <div class="sec-label" data-i18n="wt.entries"></div>
    <div class="weight-goal" id="weightGoal"></div>
    <div class="weight-log" id="weightLog"></div>
  </div>
</div>

<!-- Settings -->
<div class="tab-panel" id="tab-settings">
  <div class="section">
    <div class="sec-label" data-i18n="set.profile"></div>
    <form class="settings-group" id="profileForm">
      <label class="setting-row"><span class="setting-label" data-i18n="set.sex"></span>
        <select class="setting-input" name="sex"><option value="male" data-i18n="sex.male"></option><option value="female" data-i18n="sex.female"></option></select></label>
      <label class="setting-row"><span class="setting-label" data-i18n="set.age"></span>
        <input class="setting-input" name="age" type="number" min="15" max="90" required></label>
      <label class="setting-row"><span class="setting-label" data-i18n="set.height"></span>
        <input class="setting-input" name="height" type="number" min="120" max="230" step="0.5" required></label>
      <label class="setting-row"><span class="setting-label" data-i18n="set.weight"></span>
        <input class="setting-input" name="weight" type="number" min="30" max="300" step="0.1" required></label>
      <label class="setting-row"><span class="setting-label" data-i18n="set.activity"></span>
        <select class="setting-input wide" name="activity">
          <option value="sedentary" data-i18n="activity.sedentary"></option><option value="light" data-i18n="activity.light"></option>
          <option value="moderate" data-i18n="activity.moderate"></option><option value="active" data-i18n="activity.active"></option>
        </select></label>
      <label class="setting-row"><span class="setting-label" data-i18n="set.goal"></span>
        <select class="setting-input" name="goal"><option value="lose" data-i18n="goal.lose"></option><option value="maintain" data-i18n="goal.maintain"></option><option value="gain" data-i18n="goal.gain"></option></select></label>
      <label class="setting-row"><span class="setting-label" data-i18n="set.rate"></span>
        <input class="setting-input" name="rate" type="number" min="0.1" max="1" step="0.05"></label>
      <label class="setting-row"><span class="setting-label" data-i18n="set.protein"></span>
        <input class="setting-input" name="proteinPerKg" type="number" min="1.2" max="2.5" step="0.1"></label>
      <div class="setting-actions"><button class="setting-save" type="submit" data-i18n="btn.save"></button></div>
    </form>
    <div class="setting-hint" id="profileHint"></div>
  </div>

  <div class="section section-gap">
    <div class="sec-label" data-i18n="set.plan"></div>
    <form class="settings-group" id="planForm">
      <div id="planRows"></div>
      <label class="setting-row"><span class="setting-label" data-i18n="set.workoutTime"></span>
        <input class="setting-input" name="workoutTime" type="time" required></label>
      <label class="setting-row"><span class="setting-label" data-i18n="set.startDate"></span>
        <input class="setting-input" name="startDate" type="date"></label>
      <label class="setting-block"><span class="setting-label" data-i18n="set.mobility"></span>
        <textarea class="setting-input setting-textarea" name="mobility" rows="4"></textarea></label>
      <div class="setting-actions"><button class="setting-save" type="submit" data-i18n="btn.save"></button></div>
    </form>
    <div class="setting-hint" id="planHint"></div>
  </div>

  <div class="section section-gap">
    <div class="sec-label" data-i18n="set.ai"></div>
    <form class="settings-group" id="aiForm">
      <label class="setting-row"><span class="setting-label" data-i18n="set.apiKey"></span>
        <input class="setting-input wide" name="apiKey" type="password" autocomplete="off" placeholder="AIza…"></label>
      <label class="setting-row"><span class="setting-label" data-i18n="set.model"></span>
        <input class="setting-input wide" name="model" placeholder="gemini-2.5-flash" spellcheck="false"></label>
      <label class="setting-row setting-check"><input type="checkbox" name="rememberKey"> <span data-i18n="set.remember"></span></label>
      <div class="api-key-note" data-i18n="set.rememberHint"></div>
      <div class="setting-actions"><button class="setting-save" type="submit" data-i18n="btn.save"></button></div>
    </form>
    <div class="setting-hint" id="aiHint"></div>
    <div class="api-key-note" data-i18n="set.keySteps"></div>
  </div>

  <div class="section section-gap">
    <div class="sec-label" data-i18n="set.data"></div>
    <div class="data-actions">
      <button class="setting-save" id="exportData" data-i18n="set.export"></button>
      <button class="setting-save" id="importData" data-i18n="set.import"></button>
      <button class="setting-save danger" id="resetData" data-i18n="set.reset"></button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div class="setting-hint" id="dataHint"></div>
  </div>
</div>

<!-- Weight modal -->
<div class="modal-overlay hidden" id="weightModal" role="dialog" aria-modal="true">
  <form class="modal" id="weightForm">
    <h3 data-i18n="modal.title"></h3>
    <label class="modal-field-label" for="weightInput" data-i18n="modal.weight"></label>
    <input class="modal-input" id="weightInput" type="number" step="0.1" min="30" max="300" required>
    <label class="modal-field-label modal-gap" for="fatInput"><span data-i18n="modal.fat"></span> <span class="modal-optional" data-i18n="modal.optional"></span></label>
    <input class="modal-input" id="fatInput" type="number" step="0.1" min="3" max="60">
    <div class="modal-hint" id="modalDateHint"></div>
    <div class="modal-btns">
      <button type="button" class="modal-cancel" id="weightCancel" data-i18n="btn.cancel"></button>
      <button type="submit" class="modal-ok" data-i18n="btn.save"></button>
    </div>
  </form>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
